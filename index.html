<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BELTAH — Terminal OS</title>
<meta name="theme-color" content="#000000">
<style>
  /* Minimal hacker terminal style */
  :root{
    --bg:#000;
    --panel:#071018;
    --neon:#00ff66;
    --muted:rgba(0,255,102,0.12);
    --accent:#ffd54a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, "Courier New", monospace;
  }
  html,body{height:100%;margin:0;background:radial-gradient(circle at 10% 10%, #001 0%, #000 60%);color:var(--neon);font-family:var(--mono);-webkit-font-smoothing:antialiased}
  .app{display:flex;flex-direction:column;height:100vh;gap:8px}
  .topbar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid rgba(0,255,102,0.04)}
  .brand{font-weight:800;color:var(--accent);letter-spacing:1px}
  .sub{color:var(--muted);font-size:13px}
  .termWrap{flex:1;display:flex;overflow:hidden}
  .terminal{flex:1;padding:14px;overflow:auto;white-space:pre-wrap;line-height:1.35}
  .cmdline{display:flex;align-items:center;border-top:1px solid rgba(0,255,102,0.04);padding:10px}
  .prompt{min-width:84px;color:var(--accent);font-weight:700}
  .input{flex:1;background:transparent;border: none;outline:none;color:var(--neon);font-family:var(--mono);font-size:14px;padding:8px}
  .btn{background:transparent;border:1px solid rgba(0,255,102,0.06);color:var(--neon);padding:6px 8px;border-radius:6px;margin-left:8px;cursor:pointer}
  .muted{color:var(--muted);font-size:13px}
  /* preview pane (hidden by default) */
  .preview{width:48%;min-width:300px;background:#05070a;border-left:1px solid rgba(0,255,102,0.04);display:flex;flex-direction:column}
  .previewHeader{padding:8px 10px;border-bottom:1px solid rgba(0,255,102,0.03);display:flex;align-items:center;gap:10px}
  .previewTitle{color:var(--accent);font-weight:700}
  .previewBody{flex:1;overflow:auto;padding:12px;font-family:monospace;font-size:13px;color:#bfffd6}
  .iframeWrap{flex:1;border:0;background:#000}
  .splitHidden{display:none}
  /* log line styling */
  .line-time{color:var(--muted);display:inline-block;width:86px}
  .line-cmd{color:#9ef5c9}
  .line-err{color:#ff9b9b}
  .kbd{background:rgba(255,255,255,0.03);padding:2px 6px;border-radius:4px;border:1px solid rgba(255,255,255,0.02)}
  /* small screens */
  @media (max-width:900px){
    .termWrap{flex-direction:column}
    .preview{width:100%;min-height:220px}
  }
  /* subtle scanlines */
  .scanlines{position:fixed;left:0;right:0;top:0;bottom:0;pointer-events:none;mix-blend-mode:overlay;opacity:0.04;background-image:repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.12) 3px, rgba(0,0,0,0.12) 4px)}
</style>
</head>
<body>
<div class="app" role="application" aria-label="Beltah Terminal">
  <div class="topbar">
    <div class="brand">BELTAH OS</div>
    <div class="sub">Full-terminal mode — type <span class="kbd">help</span></div>
    <div style="margin-left:auto" class="muted">Termux & browser friendly</div>
  </div>

  <div class="termWrap">
    <div class="terminal" id="terminal" aria-live="polite" role="log"></div>

    <div class="preview splitHidden" id="preview">
      <div class="previewHeader">
        <div class="previewTitle" id="previewTitle">Preview</div>
        <div style="margin-left:auto">
          <button class="btn" id="closePreview">Close</button>
          <button class="btn" id="downloadPreview">Download</button>
        </div>
      </div>
      <div class="previewBody" id="previewBody"><!-- file content or iframe goes here --></div>
    </div>
  </div>

  <div class="cmdline" role="region" aria-label="Command line">
    <div class="prompt">&gt; beltah</div>
    <input id="cmd" class="input" autocomplete="off" spellcheck="false" inputmode="text" />
    <button id="runBtn" class="btn">RUN</button>
  </div>
</div>

<div class="scanlines" aria-hidden="true"></div>

<script>
(() => {
  // Known project files to try to fetch
  const knownFiles = [
    'commands.js','effects.js','solarsystem.js','database.json',
    'earthmap.html','hack_montage.html','style.css','hacker-mode.css','earthmap.js','earthmap.html'
  ];

  // Simple in-memory FS
  window.BeltahFS = window.BeltahFS || { files: {} };

  // DOM
  const term = document.getElementById('terminal');
  const input = document.getElementById('cmd');
  const runBtn = document.getElementById('runBtn');
  const preview = document.getElementById('preview');
  const previewBody = document.getElementById('previewBody');
  const previewTitle = document.getElementById('previewTitle');
  const closePreview = document.getElementById('closePreview');
  const downloadPreview = document.getElementById('downloadPreview');

  // Terminal helpers
  function time() { return new Date().toLocaleTimeString(); }
  function writeLine(text, cls='') {
    const d = document.createElement('div');
    d.innerHTML = `<span class="line-time">${time()}</span> <span class="${cls}">${escapeHtml(text)}</span>`;
    term.appendChild(d);
    // keep scrollback limited
    while (term.children.length > 1200) term.removeChild(term.firstChild);
    term.scrollTop = term.scrollHeight;
  }
  function writeRaw(html) {
    const d = document.createElement('div');
    d.innerHTML = html;
    term.appendChild(d);
    while (term.children.length > 1200) term.removeChild(term.firstChild);
    term.scrollTop = term.scrollHeight;
  }
  function errorLine(text) { writeLine(text, 'line-err'); }
  function infoLine(text) { writeLine(text, 'line-cmd'); }

  function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // Command history
  let history = [], hpos = 0;

  // Quick boot text
  writeRaw('<div style="color:#9ff5c9;font-weight:700">Beltah Terminal OS — full console mode</div>');
  infoLine("Type 'help' for available commands. I will try fetching project files automatically.");
  infoLine("If a file is not accessible, use 'fetch <filename>' to attempt retrieval.");

  // Try to prefetch known files (non-blocking)
  (function prefetchList(list){
    list.forEach(f => {
      fetchFile(f).then(ok=> {
        if (ok) infoLine(`prefetched: ${f}`);
      }).catch(()=>{/*ignore*/});
    });
  })(knownFiles);

  // ====================
  // File fetch / helpers
  // ====================
  async function fetchFile(path) {
    try {
      const res = await fetch(path, {cache:'no-store'});
      if (!res.ok) throw new Error('not found');
      const ct = res.headers.get('content-type') || '';
      let body;
      if (ct.includes('application/json')) body = await res.json();
      else body = await res.text();
      window.BeltahFS.files[path] = { content: body, type: ct || mimeFromExt(path) };
      return true;
    } catch (err) {
      // store failure marker
      return false;
    }
  }

  function mimeFromExt(name) {
    const ext = (name.split('.').pop()||'').toLowerCase();
    if (ext==='js') return 'application/javascript';
    if (ext==='css') return 'text/css';
    if (ext==='html' || ext==='htm') return 'text/html';
    if (ext==='json') return 'application/json';
    if (ext==='png') return 'image/png';
    return 'text/plain';
  }

  function listFiles() {
    // merged: knownFiles + fetched keys
    const remoteKeys = Object.keys(window.BeltahFS.files);
    const combined = Array.from(new Set(knownFiles.concat(remoteKeys)));
    return combined;
  }

  // ====================
  // Preview & injectors
  // ====================
  function showPreview(title, bodyHtml, isIframe=false) {
    previewTitle.textContent = title;
    preview.classList.remove('splitHidden');
    if (isIframe) {
      previewBody.innerHTML = '';
      const iframe = document.createElement('iframe');
      iframe.srcdoc = bodyHtml;
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = '0';
      previewBody.appendChild(iframe);
    } else {
      // code block
      previewBody.innerHTML = `<pre style="white-space:pre-wrap;font-family:monospace;font-size:13px">${escapeHtml(bodyHtml)}</pre>`;
    }
  }
  function closePreviewPane() {
    preview.classList.add('splitHidden');
    previewBody.innerHTML = '';
  }
  closePreview.addEventListener('click', closePreviewPane);

  downloadPreview.addEventListener('click', ()=> {
    const title = previewTitle.textContent || 'download';
    const f = window.BeltahFS.files[title] || null;
    // if preview title is a filename and exists, download it; else download preview body text
    if (f && (f.content !== undefined)) {
      const data = (typeof f.content === 'object') ? JSON.stringify(f.content, null, 2) : String(f.content);
      const blob = new Blob([data], {type: f.type || 'text/plain'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = title; a.click();
      URL.revokeObjectURL(url);
    } else {
      // download previewBody text
      const txt = previewBody.innerText || previewBody.textContent || '';
      const blob = new Blob([txt], {type:'text/plain'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `${title || 'beltah-preview'}.txt`; a.click();
      URL.revokeObjectURL(url);
    }
  });

  // Execute script content (dangerous) — user confirms in terminal
  function injectScriptText(jsText, filename = 'injected.js') {
    try {
      const s = document.createElement('script');
      s.type = 'module';
      s.textContent = jsText;
      document.body.appendChild(s);
      infoLine(`Injected script: ${filename}`);
      return true;
    } catch (e) {
      errorLine('Script injection failed: ' + e.message);
      return false;
    }
  }

  // Apply CSS text inline
  function applyCssText(cssText, name='injected.css') {
    const s = document.createElement('style');
    s.setAttribute('data-source', name);
    s.textContent = cssText;
    document.head.appendChild(s);
    infoLine(`Applied CSS: ${name}`);
  }

  // ====================
  // Commands
  // ====================
  function cmd_help() {
    infoLine("available commands:");
    writeRaw(`<div class="muted">ls</div> — list known files`);
    writeRaw(`<div class="muted">fetch &lt;file&gt;</div> — fetch file into BeltahFS`);
    writeRaw(`<div class="muted">cat &lt;file&gt;</div> — show raw content (if fetched)`);
    writeRaw(`<div class="muted">open &lt;htmlfile&gt;</div> — preview an HTML file in split pane`);
    writeRaw(`<div class="muted">inject &lt;script.js&gt;</div> — fetch and execute JS (TRUSTED files only)`);
    writeRaw(`<div class="muted">style &lt;file.css&gt;</div> — fetch and apply CSS`);
    writeRaw(`<div class="muted">download &lt;file&gt;</div> — download file to local device`);
    writeRaw(`<div class="muted">theme hacker|normal</div> — toggle hacker palette`);
    writeRaw(`<div class="muted">clear</div> — clear terminal`);
  }

  async function cmd_ls() {
    const files = listFiles();
    writeRaw(`<div class="muted">Known files (${files.length})</div>`);
    files.forEach(f => {
      const has = window.BeltahFS.files[f] ? '<span style="color:#9ef5c9">[cached]</span>' : '';
      writeRaw(`<div>${escapeHtml(f)} ${has}</div>`);
    });
  }

  async function cmd_fetch(args) {
    const file = args.trim();
    if (!file) { errorLine('usage: fetch <filename>'); return; }
    infoLine('fetching ' + file + ' ...');
    const ok = await fetchFile(file);
    if (ok) {
      infoLine('fetched: ' + file);
      // if it's CSS and we want auto-apply? leave to user
    } else {
      errorLine('failed to fetch: ' + file + ' (check path / CORS)');
    }
  }

  function cmd_cat(args) {
    const file = args.trim();
    if (!file) { errorLine('usage: cat <filename>'); return; }
    const f = window.BeltahFS.files[file];
    if (!f) { errorLine('file not cached. run fetch ' + file); return; }
    // pretty print JSON if possible
    if (f.type && f.type.includes('application/json') && typeof f.content === 'object') {
      showPreview(file, JSON.stringify(f.content, null, 2), false);
    } else {
      showPreview(file, (typeof f.content === 'object') ? JSON.stringify(f.content, null, 2) : String(f.content), false);
    }
  }

  function cmd_open(args) {
    const file = args.trim();
    if (!file) { errorLine('usage: open <htmlfile>'); return; }
    const f = window.BeltahFS.files[file];
    if (!f) {
      // try fetch first
      cmd_fetch(file).then(()=> {
        const f2 = window.BeltahFS.files[file];
        if (!f2) return errorLine('open failed: ' + file);
        // if HTML, embed into iframe via srcdoc
        if ((f2.type && f2.type.includes('text/html')) || file.endsWith('.html')) {
          showPreview(file, (typeof f2.content === 'object') ? JSON.stringify(f2.content) : String(f2.content), true);
        } else {
          // show raw
          showPreview(file, (typeof f2.content === 'object') ? JSON.stringify(f2.content,null,2) : String(f2.content), false);
        }
      });
      return;
    }
    if ((f.type && f.type.includes('text/html')) || file.endsWith('.html')) {
      showPreview(file, (typeof f.content === 'object') ? JSON.stringify(f.content) : String(f.content), true);
    } else {
      showPreview(file, (typeof f.content === 'object') ? JSON.stringify(f.content,null,2) : String(f.content), false);
    }
  }

  async function cmd_inject(args) {
    const file = args.trim();
    if (!file) { errorLine('usage: inject <script.js>'); return; }
    // confirm prompt via terminal
    infoLine('WARNING: inject will execute remote JS in this page. Type YES to confirm.');
    // simple blocking-like prompt (listen for next input)
    const confirm = await waitForNextInput();
    if (confirm.trim().toUpperCase() !== 'YES') {
      infoLine('inject cancelled');
      return;
    }
    // fetch if needed
    if (!window.BeltahFS.files[file]) {
      const ok = await fetchFile(file);
      if (!ok) return errorLine('failed to fetch ' + file);
    }
    const f = window.BeltahFS.files[file];
    const code = (typeof f.content === 'object') ? JSON.stringify(f.content) : String(f.content);
    injectScriptText(code, file);
  }

  async function cmd_style(args) {
    const file = args.trim();
    if (!file) { errorLine('usage: style <file.css>'); return; }
    if (!window.BeltahFS.files[file]) {
      const ok = await fetchFile(file);
      if (!ok) return errorLine('failed to fetch ' + file);
    }
    const f = window.BeltahFS.files[file];
    applyCssText(typeof f.content === 'object' ? JSON.stringify(f.content) : String(f.content), file);
  }

  async function cmd_download(args) {
    const file = args.trim();
    if (!file) { errorLine('usage: download <file>'); return; }
    // attempt to fetch if not cached
    if (!window.BeltahFS.files[file]) {
      const ok = await fetchFile(file);
      if (!ok) return errorLine('failed to fetch ' + file);
    }
    const f = window.BeltahFS.files[file];
    const data = (typeof f.content === 'object') ? JSON.stringify(f.content, null, 2) : String(f.content);
    const blob = new Blob([data], {type: f.type || 'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = file; a.click();
    URL.revokeObjectURL(url);
    infoLine('download initiated: ' + file);
  }

  function cmd_theme(args) {
    const choice = args.trim().toLowerCase();
    if (choice === 'hacker') {
      document.documentElement.style.setProperty('--neon', '#00ff88');
      document.documentElement.style.setProperty('--accent', '#ffd54a');
      infoLine('hacker theme ON');
    } else if (choice === 'normal') {
      document.documentElement.style.setProperty('--neon', '#9ef5c9');
      infoLine('normal theme ON');
    } else {
      errorLine('usage: theme hacker|normal');
    }
  }

  // utility to wait for the next line typed by user, returns a Promise
  function waitForNextInput() {
    return new Promise(resolve => {
      const handler = (val) => {
        resolve(val);
      };
      // set a one-time temporary input listener
      const onKey = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const v = input.value;
          input.value = '';
          history.push(v);
          hpos = history.length;
          document.removeEventListener('keydown', onKey);
          handler(v);
        }
      };
      document.addEventListener('keydown', onKey);
      infoLine('Type your response and press Enter:');
    });
  }

  // Command dispatcher
  async function handleCommand(line) {
    const raw = line.trim();
    if (!raw) return;
    writeRaw(`<div><span class="line-time">${time()}</span> <span class="line-cmd">&gt; ${escapeHtml(raw)}</span></div>`);
    const parts = raw.split(/\s+/);
    const cmd = parts[0].toLowerCase();
    const args = parts.slice(1).join(' ');
    switch (cmd) {
      case 'help': cmd_help(); break;
      case 'ls': cmd_ls(); break;
      case 'fetch': await cmd_fetch(args); break;
      case 'cat': cmd_cat(args); break;
      case 'open': cmd_open(args); break;
      case 'inject': await cmd_inject(args); break;
      case 'style': await cmd_style(args); break;
      case 'download': await cmd_download(args); break;
      case 'theme': cmd_theme(args); break;
      case 'clear': term.innerHTML=''; infoLine('screen cleared'); break;
      case 'exit': infoLine('no-op in browser environment'); break;
      default:
        errorLine('unknown command: ' + cmd + ' — type help');
    }
  }

  // Input handling
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const v = input.value;
      input.value = '';
      history.push(v);
      hpos = history.length;
      handleCommand(v).catch(err => errorLine('cmd error: ' + err.message));
    } else if (e.key === 'ArrowUp') {
      if (history.length && hpos > 0) { hpos--; input.value = history[hpos] || ''; }
      else if (history.length && hpos === history.length) { hpos = history.length - 1; input.value = history[hpos] || ''; }
      e.preventDefault();
    } else if (e.key === 'ArrowDown') {
      if (history.length && hpos < history.length - 1) { hpos++; input.value = history[hpos] || ''; } else { hpos = history.length; input.value = ''; }
      e.preventDefault();
    }
  });

  runBtn.addEventListener('click', ()=> {
    const v = input.value;
    input.value = '';
    history.push(v);
    hpos = history.length;
    handleCommand(v).catch(err => errorLine('cmd error: ' + err.message));
  });

  // Accessibility: allow clicking on terminal to focus input
  term.addEventListener('click', ()=> input.focus());

  // Expose a small API for other scripts (if they are injected)
  window.BeltahAPI = {
    write: infoLine,
    error: errorLine,
    preview: showPreview,
    fetchFile, // expose the fetch helper
    files: window.BeltahFS.files
  };

  // final focus
  input.focus();

})();
</script>
</body>
</html>
