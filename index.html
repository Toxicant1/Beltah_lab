<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Beltah CyberLab — Africa Network Simulation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- UX Overlays -->
  <div id="scanlines"></div>
  <div id="vignette"></div>

  <!-- Header -->
  <header class="top-bar">
    <h1 class="brand glitch">BELTAH CYBERLAB</h1>
    <span class="subtitle">⟐ Africa Network Simulation ⟐</span>
    <div class="controls">
      <button id="demoSeq" class="btn green">▶ Demo</button>
      <button id="clearLogs" class="btn red">✖ Clear Logs</button>
    </div>
  </header>

  <!-- Layout -->
  <main class="wrap">

    <!-- Terminal -->
    <section class="panel terminal">
      <div class="chrome"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <h2 class="panel-title">TERMINAL CONSOLE</h2>
      <div id="terminal"></div>
      <input id="cmd" type="text" autocomplete="off" placeholder="> Enter command (type help)" />
    </section>

    <!-- Network Map -->
    <section class="panel map">
      <div class="chrome"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <h2 class="panel-title">AFRICA NETWORK MAP</h2>
      <div id="map"></div>
    </section>

    <!-- Stats -->
    <section class="panel stats">
      <div class="chrome"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <h2 class="panel-title">SYSTEM METRICS</h2>
      <div class="stat"><span>CPU</span><div class="bar"><i id="cpuBar"></i></div><span id="cpuVal">0%</span></div>
      <div class="stat"><span>RAM</span><div class="bar"><i id="memBar"></i></div><span id="memVal">0%</span></div>
      <div class="stat"><span>NET</span><div class="bar"><i id="netBar"></i></div><span id="netVal">0%</span></div>
    </section>

    <!-- Live Logs -->
    <section class="panel logs">
      <div class="chrome"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <h2 class="panel-title">LIVE ACTIVITY FEED</h2>
      <div id="feed"></div>
    </section>

  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
