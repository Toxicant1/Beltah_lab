<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BELTAH — Terminal OS (CRT mode)</title>

<!-- font (monospace hacker vibe) -->
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#020305;
    --term-bg: linear-gradient(180deg, rgba(0,4,2,0.98), rgba(2,6,8,0.92));
    --neon: #00ff88;
    --muted: rgba(0,255,136,0.12);
    --accent: #ffd54a;
    --glass: rgba(5,8,10,0.46);
    --mono: 'VT323', ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    --realism-intensity: 0.28;
  }

  /* Page */
  html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:var(--mono);color:var(--neon);-webkit-font-smoothing:antialiased}
  body{background:
    radial-gradient(1200px 400px at 10% 10%, rgba(0,255,136,0.03), transparent 8%),
    radial-gradient(1000px 300px at 90% 80%, rgba(255,213,74,0.01), transparent 12%),
    linear-gradient(180deg,#000,#020911 70%);
  }

  /* Top bar */
  .topbar{position:relative;z-index:6;display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(0,255,136,0.03);backdrop-filter: blur(2px)}
  .brand{font-weight:800;color:var(--accent);letter-spacing:2px}
  .sub{color:rgba(0,255,136,0.12);font-size:12px;margin-left:6px}
  .muted{color:rgba(0,255,136,0.12);font-size:12px;margin-left:auto}

  /* Shell layout */
  .wrap{display:flex;height:calc(100vh - 56px);gap:12px;padding:18px;box-sizing:border-box}
  .terminal{
    flex:1; background:var(--term-bg); border-radius:12px; padding:18px; box-shadow:
      0 8px 40px rgba(0,0,0,0.8),
      0 0 40px rgba(0,255,136,0.03) inset;
    border: 1px solid rgba(0,255,136,0.06);
    position:relative; overflow:hidden;
  }

  /* CRT overlays */
  .terminal::before{
    content:""; position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(transparent, rgba(0,0,0,0.06));
    mix-blend-mode:overlay;
  }
  .scanlines{position:absolute;inset:0;pointer-events:none;background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,var(--realism-intensity)), rgba(0,0,0,var(--realism-intensity)) 2px, transparent 2px, transparent 4px);
    opacity:0.85;mix-blend-mode: multiply}
  .vignette{position:absolute;inset:0;pointer-events:none;box-shadow: inset 0 120px 220px rgba(0,0,0,0.6), inset 0 -120px 220px rgba(0,0,0,0.6) }

  /* Glowing header inside terminal */
  .term-header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .term-title{color:var(--accent);font-weight:700;letter-spacing:1px}
  .term-sub{color:rgba(0,255,136,0.12);font-size:12px}

  /* Terminal output area */
  .screen{height:calc(100% - 84px);overflow:auto;padding:8px 6px;border-radius:8px;background:rgba(0,0,0,0.06);backdrop-filter: blur(2px)}
  .log-line{font-family:var(--mono);font-size:18px;line-height:1.18;white-space:pre-wrap;color:var(--neon);text-shadow: 0 0 8px rgba(0,255,136,0.06)}
  .time{display:inline-block;color:rgba(0,255,136,0.12);width:92px;font-size:12px;margin-right:8px}
  .cmdline{display:flex;align-items:center;gap:8px;padding-top:12px}

  /* prompt + input */
  .prompt{color:var(--accent);font-weight:700;min-width:120px}
  .input{flex:1;background:transparent;border:1px solid rgba(0,255,136,0.04);padding:10px 12px;border-radius:8px;color:var(--neon);font-family:var(--mono);font-size:16px;outline:none;box-shadow:0 6px 18px rgba(0,0,0,0.6) inset}
  .btn{background:transparent;border:1px solid rgba(0,255,136,0.06);color:var(--neon);padding:8px 10px;border-radius:8px;cursor:pointer}

  /* preview pane */
  .preview{width:420px;min-width:320px;background:linear-gradient(180deg, rgba(2,4,6,0.6), rgba(6,8,10,0.5));border-radius:12px;padding:12px;border:1px solid rgba(0,255,136,0.04);box-shadow:0 10px 40px rgba(0,0,0,0.7)}
  .previewTitle{color:var(--accent);font-weight:700;margin-bottom:8px}
  .previewBody{background:rgba(0,0,0,0.06);border-radius:8px;height:calc(100% - 44px);overflow:auto;padding:10px;font-family:var(--mono);font-size:14px;color:#c9ffd9}

  /* small realism flicker */
  @keyframes flicker {
    0% {opacity:0.98} 5% {opacity:0.84} 7%{opacity:0.95} 10%{opacity:0.9} 100%{opacity:0.98}
  }
  .terminal.flicker { animation: flicker 3s linear infinite }

  /* typewriter cursor (in screen) */
  .typing-cursor { display:inline-block;width:10px;height:18px;background:var(--neon);margin-left:4px;vertical-align:middle;animation:blink 900ms steps(2,start) infinite;box-shadow:0 0 14px rgba(0,255,136,0.2) }
  @keyframes blink{50%{opacity:0}}

  /* mobile tweaks */
  @media (max-width:920px){
    .wrap{flex-direction:column;padding:12px}
    .preview{width:100%;min-width:100%}
    .screen{height:48vh}
  }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="brand">BELTAH OS</div>
  <div class="sub">cyberlab live • termux-friendly</div>
  <div class="muted">type <strong>help</strong></div>
</div>

<!-- Main -->
<div class="wrap">
  <div class="terminal flicker" id="terminalBox" role="application" aria-label="Terminal">
    <div class="scanlines" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <div class="term-header">
      <div class="term-title">BELTAH Terminal</div>
      <div class="term-sub">realistic console simulation</div>
    </div>

    <div class="screen" id="screen" aria-live="polite"></div>

    <div class="cmdline" style="margin-top:10px">
      <div class="prompt">&gt; beltah</div>
      <input id="cmd" class="input" placeholder="help / ls / fetch / open / cat / inject / style / download / clear" autocomplete="off" />
      <button id="runBtn" class="btn">RUN</button>
    </div>
  </div>

  <div class="preview" id="previewPane" aria-hidden="true" style="display:none">
    <div class="previewTitle" id="previewTitle">Preview</div>
    <div class="previewBody" id="previewBody"></div>
  </div>
</div>

<script>
/* ========== BELTAH — realistic terminal behavior ========== */
/* Core: improved typewriter output, better UX, same fetch/fs features */

(async () => {
  // known files (same as you had)
  const knownFiles = ['commands.js','effects.js','solarsystem.js','database.json','earthmap.html','hack_montage.html','style.css','hacker-mode.css','earthmap.js','earthmap.html'];

  // tiny in-memory FS
  window.BeltahFS = window.BeltahFS || { files: {} };

  // DOM
  const screen = document.getElementById('screen');
  const input = document.getElementById('cmd');
  const runBtn = document.getElementById('runBtn');
  const preview = document.getElementById('previewPane');
  const previewBody = document.getElementById('previewBody');
  const previewTitle = document.getElementById('previewTitle');
  const terminalBox = document.getElementById('terminalBox');

  // realism tuning
  const TYPE_MIN = 6;  // ms per char minimal
  const TYPE_MAX = 24; // ms per char maximal (randomized)
  const LINES_PAUSE = 80; // pause between automatic lines

  // printing helpers
  function timeStamp() {
    const d = new Date();
    return d.toLocaleTimeString();
  }

  function appendRaw(html) {
    const div = document.createElement('div');
    div.className = 'log-line';
    div.innerHTML = html;
    screen.appendChild(div);
    // keep scrollback sane
    while (screen.children.length > 1200) screen.removeChild(screen.firstChild);
    screen.scrollTop = screen.scrollHeight;
    return div;
  }

  // type out a single line with typewriter effect
  async function typeLine(text, opts = {}) {
    const when = timeStamp();
    const container = appendRaw(`<span class="time">${when}</span> <span class="line-cmd"></span>`);
    const span = container.querySelector('.line-cmd');
    // small chance to add glitchy characters for realism
    const txt = String(text);
    for (let i = 0; i < txt.length; i++) {
      const c = txt[i];
      span.textContent += c;
      screen.scrollTop = screen.scrollHeight;
      await sleep(random(TYPE_MIN, TYPE_MAX));
    }
    // tiny trailing pause
    await sleep(28);
    return container;
  }

  // instant line (no type)
  function instantLine(text, cls='line-cmd') {
    return appendRaw(`<span class="time">${timeStamp()}</span> <span class="${cls}">${escapeHtml(text)}</span>`);
  }

  // quick utilities
  function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }
  function random(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

  // prefill small welcome quickly with type effect
  await typeLine('Beltah Terminal • realistic sim • ready');
  await typeLine("Type 'help' for commands. try: ping Kenya");
  instantLine('Boot @ ' + new Date().toLocaleTimeString());

  // fetch file helper (returns true if fetched)
  async function fetchFile(path) {
    try {
      const res = await fetch(path, {cache:'no-store'});
      if (!res.ok) throw new Error('not found');
      const ct = res.headers.get('content-type') || '';
      let body;
      if (ct.includes('application/json')) body = await res.json();
      else body = await res.text();
      window.BeltahFS.files[path] = { content: body, type: ct || mimeFromExt(path) };
      return true;
    } catch (err) {
      return false;
    }
  }

  function mimeFromExt(name) {
    const ext = (name.split('.').pop()||'').toLowerCase();
    if (ext==='js') return 'application/javascript';
    if (ext==='css') return 'text/css';
    if (ext==='html') return 'text/html';
    if (ext==='json') return 'application/json';
    return 'text/plain';
  }

  // prefetch common files but do not auto-execute (nonblocking)
  knownFiles.forEach(f => {
    fetchFile(f).then(ok => {
      if (ok) instantLine('prefetched: ' + f);
    }).catch(()=>{/*noop*/});
  });

  // Preview helpers
  function showPreview(title, body, isHtml=false) {
    preview.style.display = 'block';
    preview.setAttribute('aria-hidden','false');
    previewTitle.textContent = title;
    previewBody.innerHTML = isHtml ? body : `<pre style="white-space:pre-wrap">${escapeHtml(body)}</pre>`;
  }
  function hidePreview() {
    preview.style.display = 'none';
    preview.setAttribute('aria-hidden','true');
    previewBody.innerHTML = '';
  }

  // injection helpers
  function injectScriptText(jsText, filename='injected.js') {
    try {
      const s = document.createElement('script');
      s.type = 'module';
      s.textContent = jsText;
      document.body.appendChild(s);
      instantLine('Injected script: ' + filename);
      return true;
    } catch(e) {
      instantLine('Script injection failed: ' + e.message, 'line-err');
      return false;
    }
  }
  function applyCssText(cssText, name='injected.css') {
    const s = document.createElement('style');
    s.setAttribute('data-source', name);
    s.textContent = cssText;
    document.head.appendChild(s);
    instantLine('Applied CSS: ' + name);
  }

  // interactive prompt helper (for confirming risky ops)
  function waitForOneInput() {
    return new Promise(resolve => {
      function onKey(e){
        if (e.key === 'Enter') {
          e.preventDefault();
          const v = input.value;
          input.value = '';
          input.removeEventListener('keydown', onKey);
          resolve(v);
        }
      }
      input.addEventListener('keydown', onKey);
      instantLine('Type response and press Enter');
      input.focus();
    });
  }

  // Command implementations (same set as before)
  function cmd_help() {
    instantLine('commands: ls, fetch <file>, cat <file>, open <html>, inject <file.js>, style <file.css>, download <file>, theme hacker|normal, clear');
  }
  function cmd_ls() {
    const files = Array.from(new Set( knownFiles.concat(Object.keys(window.BeltahFS.files)) ));
    instantLine('Known files:');
    files.forEach(f => {
      const tag = window.BeltahFS.files[f] ? ' [cached]' : '';
      instantLine('  ' + f + tag);
    });
  }
  async function cmd_fetch(arg) {
    const file = arg.trim();
    if (!file) { instantLine('usage: fetch <file>'); return; }
    instantLine('fetching ' + file + ' ...');
    const ok = await fetchFile(file);
    if (ok) instantLine('fetched: ' + file);
    else instantLine('failed to fetch: ' + file + ' (CORS / path?)', 'line-err');
  }
  function cmd_cat(arg) {
    const file = arg.trim();
    if (!file) { instantLine('usage: cat <file>'); return; }
    const f = window.BeltahFS.files[file];
    if (!f) { instantLine('file not cached. use fetch ' + file, 'line-err'); return; }
    const s = (typeof f.content === 'object') ? JSON.stringify(f.content, null, 2) : String(f.content);
    showPreview(file, s, false);
  }
  async function cmd_open(arg) {
    const file = arg.trim();
    if (!file) { instantLine('usage: open <htmlfile>'); return; }
    if (!window.BeltahFS.files[file]) {
      const ok = await fetchFile(file);
      if (!ok) { instantLine('open failed: ' + file, 'line-err'); return; }
    }
    const f = window.BeltahFS.files[file];
    const doc = (typeof f.content === 'object') ? JSON.stringify(f.content) : String(f.content);
    // open HTML as iframe via srcdoc
    showPreview(file, doc, true);
    previewBody.innerHTML = '';
    const iframe = document.createElement('iframe');
    iframe.srcdoc = doc;
    iframe.style.width = '100%';
    iframe.style.height = '100%';
    iframe.style.border = '0';
    previewBody.appendChild(iframe);
  }
  async function cmd_inject(arg) {
    const file = arg.trim();
    if (!file) { instantLine('usage: inject <script.js>'); return; }
    instantLine('WARNING: inject executes code. Type YES to confirm.');
    const conf = await waitForOneInput();
    if (conf.trim().toUpperCase() !== 'YES') { instantLine('inject cancelled'); return; }
    if (!window.BeltahFS.files[file]) {
      const ok = await fetchFile(file);
      if (!ok) { instantLine('failed to fetch ' + file, 'line-err'); return; }
    }
    const f = window.BeltahFS.files[file];
    const code = (typeof f.content === 'object') ? JSON.stringify(f.content) : String(f.content);
    injectScriptText(code, file);
  }
  async function cmd_style(arg) {
    const file = arg.trim();
    if (!file) { instantLine('usage: style <file.css>'); return; }
    if (!window.BeltahFS.files[file]) {
      const ok = await fetchFile(file);
      if (!ok) { instantLine('failed to fetch ' + file, 'line-err'); return; }
    }
    const f = window.BeltahFS.files[file];
    const css = (typeof f.content === 'object') ? JSON.stringify(f.content) : String(f.content);
    applyCssText(css, file);
  }
  async function cmd_download(arg) {
    const file = arg.trim();
    if (!file) { instantLine('usage: download <file>'); return; }
    if (!window.BeltahFS.files[file]) {
      const ok = await fetchFile(file);
      if (!ok) { instantLine('failed to fetch ' + file, 'line-err'); return; }
    }
    const f = window.BeltahFS.files[file];
    const data = (typeof f.content === 'object') ? JSON.stringify(f.content, null, 2) : String(f.content);
    const blob = new Blob([data], {type: f.type || 'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = file; a.click();
    URL.revokeObjectURL(url);
    instantLine('download started: ' + file);
  }
  function cmd_theme(arg) {
    const c = arg.trim().toLowerCase();
    if (c === 'hacker') { document.documentElement.style.setProperty('--neon', '#00ff88'); document.documentElement.style.setProperty('--accent','#ffd54a'); terminalBox.classList.add('flicker'); instantLine('hacker theme on'); }
    else if (c === 'normal') { document.documentElement.style.setProperty('--neon', '#9ef5c9'); terminalBox.classList.remove('flicker'); instantLine('normal theme on'); }
    else instantLine('usage: theme hacker|normal', 'line-err');
  }

  // command dispatcher
  async function dispatchCommand(line) {
    const raw = (line||'').trim();
    if (!raw) return;
    // echo command instantly (like a terminal)
    appendRaw(`<span class="time">${timeStamp()}</span> <span class="line-cmd">&gt; ${escapeHtml(raw)}</span>`);
    const parts = raw.split(/\s+/);
    const cmd = parts[0].toLowerCase();
    const args = parts.slice(1).join(' ');
    switch (cmd) {
      case 'help': cmd_help(); break;
      case 'ls': cmd_ls(); break;
      case 'fetch': await cmd_fetch(args); break;
      case 'cat': cmd_cat(args); break;
      case 'open': await cmd_open(args); break;
      case 'inject': await cmd_inject(args); break;
      case 'style': await cmd_style(args); break;
      case 'download': await cmd_download(args); break;
      case 'theme': cmd_theme(args); break;
      case 'clear': screen.innerHTML=''; instantLine('screen cleared'); break;
      default:
        instantLine('unknown: ' + cmd + ' — type help', 'line-err');
    }
  }

  // handle input
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const val = input.value;
      input.value = '';
      dispatchCommand(val);
    }
  });
  runBtn.addEventListener('click', ()=> {
    const v = input.value;
    input.value = '';
    dispatchCommand(v);
  });

  // allow click to hide preview
  screen.addEventListener('click', ()=> {
    if (preview.style.display !== 'none') hidePreview();
    input.focus();
  });

  // expose Beltah API if you want
  window.BeltahAPI = {
    write: (s)=> instantLine(s),
    fetchFile,
    files: window.BeltahFS.files,
    showPreview,
    hidePreview
  };

})();
</script>

</body>
</html>
